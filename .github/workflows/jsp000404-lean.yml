name: JSP-000404 Lean

on:
  push:
    branches:
      - research/jsp-000404-sharp-centre
    paths:
      - "submissions/jsp-000404-wip-charlie/**"
      - ".github/workflows/jsp000404-lean.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsp000404-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check active JSP-000404 proof chain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf             https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh             -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake package cache
        id: lake-package-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            submissions/jsp-000404-wip-charlie/.lake/packages
            submissions/jsp-000404-wip-charlie/lake-manifest.json
          key: jsp000404-lake-v2-${{ runner.os }}-${{ hashFiles('submissions/jsp-000404-wip-charlie/lakefile.toml', 'submissions/jsp-000404-wip-charlie/lean-toolchain') }}

      - name: Resolve Lake dependencies
        if: steps.lake-package-cache.outputs.cache-hit != 'true'
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake update

      - name: Save Lake package cache
        if: steps.lake-package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            submissions/jsp-000404-wip-charlie/.lake/packages
            submissions/jsp-000404-wip-charlie/lake-manifest.json
          key: ${{ steps.lake-package-cache.outputs.cache-primary-key }}

      - name: Restore mathlib cache
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake exe cache get

      - name: Check current recursive triangle frontier
        working-directory: submissions/jsp-000404-wip-charlie
        run: |
          lake build JSP000404Research.ResidualEnlargedTriangleOutlet
          lake build JSP000404Research.ResidualLossThreeExitRecursiveOutlet
          lake build JSP000404Research.ResidualExactSharedRecursiveOutlet
          lake build JSP000404Research.ProjectionEnlargedCandidateHall

      - name: Check source-assembly repairs
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.SourceAssemblyRepairs

      - name: Check small-angle outer bounds
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.SmallAngleOuterBounds

      - name: Check Hamiltonian residual separation
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.HamiltonianResidualSeparation


      - name: Check Hamiltonian residual base triangle
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.HamiltonianResidualBaseTriangle

      - name: Check Hamiltonian four-angle budget
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.HamiltonianResidualBudget


      - name: Check transition quotient arithmetic
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.TransitionQuotientArithmetic

      - name: Check middle-hidden quotient bound
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.SupportThreeMiddleHiddenQuotient



      - name: Check middle-hidden local sign shape
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.SupportThreeMiddleHiddenSigns

      - name: Check explicit middle-hidden cycle certificate
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.SupportThreeMiddleHiddenCycleCertificate

      - name: Check middle-hidden cycle geometry
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.MiddleHiddenCycleGeometry

      - name: Check middle-hidden canonical wrap cases
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.SupportThreeMiddleHiddenWrapCases

      - name: Check middle-hidden raw sign cases
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.SupportThreeMiddleHiddenRawSignCases

      - name: Check middle-hidden canonical sign bridge
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.SupportThreeMiddleHiddenCanonicalSigns

      - name: Check middle-hidden canonical rank band
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.MiddleHiddenCanonicalRankBand

      - name: Check Hamiltonian transversal ordering
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.HamiltonianResidualTransversal

      - name: Check canonical ray foundations
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.CanonicalProjectiveRay

      - name: Check sign-transition budget
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.SignTransitionBudget

      - name: Check Boolean sign shape
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.BoolSignShape

      - name: Check canonical sign acyclicity
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.CanonicalSignAcyclicity

      - name: Check triangle sign uniqueness
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.TriangleSignUniqueness

      - name: Check crossed sign contradiction
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.TriangleTwoSplitContradiction

      - name: Check transition quotient large angle
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.TransitionQuotientLargeAngle

      - name: Check positive member quotient bound
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ListPositiveMemberBound

      - name: Check positive transition angle alignment
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.PositiveTransitionAngleAlignment

      - name: Check middle-hidden large bridge
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.SupportThreeMiddleHiddenLargeBridge

      - name: Check middle-hidden cross-angle amplification
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.MiddleHiddenCrossAngle

      - name: Check enriched middle-hidden certificate
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.SupportThreeMiddleHiddenSeparatedPattern

      - name: Check two enriched mixed patterns
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.MixedSupportThreeSeparatedPatterns

      - name: Check paired middle-hidden transition witnesses
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.MixedSupportThreeMiddleWitnesses

      - name: Check canonical sign order
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.CanonicalSignOrder

      - name: Check canonical-rank middle terminal
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.CanonicalRankMiddleTerminal

      - name: Check middle-hidden rank bridge
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.MiddleHiddenRankBridge

      - name: Check support-one Hamiltonian amplification
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.SupportOneHamiltonianResidual

      - name: Check middle-hidden bridge lower bound
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.MiddleHiddenBridgeLowerBound

      - name: Check large transition quotient bound
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.LargeTransitionAngleQuotientBound

      - name: Check middle-hidden outer amplification
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.MiddleHiddenOuterAmplification

      - name: Check mixed support-one outer amplification
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.MixedSupportOneOuterAmplification

      - name: Check positive transition large-angle converse
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.PositiveTransitionLargeAngleBound

      - name: Check mixed support-one outer witness pair
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.MixedSupportOneOuterPair

      - name: Check mixed support-one outer quotient bound
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.MixedSupportOneOuterQuotientBound

      - name: Check paired outer quotient bounds
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.MixedSupportOneTwoOuterQuotients

      - name: Check translated-overlap collision chain
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ResidualTranslatedOverlapCrossDisjoint

      - name: Check safe common-inactive tensor reduction
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ResidualSafeCommonInactiveTensor

      - name: Check safe common-inactive positive capacity
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ResidualSafeCommonInactiveCapacity

      - name: Check safe common-inactive reduced-zero rigidity
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ResidualSafeCommonInactiveReducedZero

      - name: Check support-unsafe carrier matching
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ResidualSafeSupportMatching
