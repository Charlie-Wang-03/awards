name: JSP-000395 PC5 submission

on:
  pull_request:
    paths:
      - 'submissions/jsp-000395-pc5-charlie-wang-03/**'
      - '.github/workflows/jsp-000395-pc5-submission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify pinned PC5 package
        working-directory: submissions/jsp-000395-pc5-charlie-wang-03
        run: |
          set -o pipefail
          ./verify.sh | tee verification-run.txt

      - name: Upload verification log
        uses: actions/upload-artifact@v4
        with:
          name: jsp-000395-pc5-verification
          path: submissions/jsp-000395-pc5-charlie-wang-03/verification-run.txt
