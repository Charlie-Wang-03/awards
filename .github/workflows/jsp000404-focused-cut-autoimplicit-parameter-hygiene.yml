name: JSP-000404 Focused Cut Autoimplicit Parameter Hygiene

on:
  push:
    branches:
      - research/jsp-000404-connector-compiler-repair-20261024
    paths:
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/CutBoundarySwapWrapBound.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/CutCentreSignPath.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/CutMergedTwoBadCommonInterior.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/CutMixedSupportBoundarySwapExact.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/CutMixedSupportBoundarySwapSpan.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/CutMixedSupportExactWitnessReduction.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/CutMixedSupportOneTwoBoundarySwap.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/CutMixedSupportOneTwoBoundarySwapReduction.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/CutSaturatedPositiveStepTight.lean"
      - ".github/workflows/jsp000404-focused-cut-autoimplicit-parameter-hygiene.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsp000404-cut-autoimplicit-parameter-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Audit executable proof holes
        working-directory: submissions/jsp-000404-wip-charlie
        run: |
          python3 scripts/jsp000404_sorry_audit.py --self-test
          python3 scripts/jsp000404_sorry_audit.py --root JSP000404Research --allowed-wip JSP000404Research/PlanarLowerBranchProofAdmittedWIP.lean --wip-max-sorries 1
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        id: lake-packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            submissions/jsp-000404-wip-charlie/.lake/packages
            submissions/jsp-000404-wip-charlie/lake-manifest.json
          key: jsp000404-lake-v2-${{ runner.os }}-${{ hashFiles('submissions/jsp-000404-wip-charlie/lakefile.toml', 'submissions/jsp-000404-wip-charlie/lean-toolchain') }}
      - name: Resolve dependencies if uncached
        if: steps.lake-packages.outputs.cache-hit != 'true'
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake update
      - name: Restore pinned Mathlib oleans
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake exe cache get
      - name: Kernel-check nine original cut files without AngleCap autoimplicit shadow binding
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.CutBoundarySwapWrapBound JSP000404Research.CutCentreSignPath JSP000404Research.CutMergedTwoBadCommonInterior JSP000404Research.CutMixedSupportBoundarySwapExact JSP000404Research.CutMixedSupportBoundarySwapSpan JSP000404Research.CutMixedSupportExactWitnessReduction JSP000404Research.CutMixedSupportOneTwoBoundarySwap JSP000404Research.CutMixedSupportOneTwoBoundarySwapReduction JSP000404Research.CutSaturatedPositiveStepTight
      - name: Scope
        if: always()
        run: echo 'Compiling four legacy cut modules is a structural proof repair and does not complete JSP-000404.'
