      - ".github/workflows/jsp000404-focused-exact-collision-eligibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsp000404-focused-exact-collision-eligibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Audit executable proof holes
        working-directory: submissions/jsp-000404-wip-charlie
        run: |
          python3 scripts/jsp000404_sorry_audit.py --root JSP000404Research --allowed-wip JSP000404Research/PlanarLowerBranchProofAdmittedWIP.lean --wip-max-sorries 1
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        id: lake-packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            submissions/jsp-000404-wip-charlie/.lake/packages
            submissions/jsp-000404-wip-charlie/lake-manifest.json
          key: jsp000404-lake-v2-${{ runner.os }}-${{ hashFiles('submissions/jsp-000404-wip-charlie/lakefile.toml', 'submissions/jsp-000404-wip-charlie/lean-toolchain') }}
      - name: Resolve dependencies if uncached
        if: steps.lake-packages.outputs.cache-hit != 'true'
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake update
      - name: Restore pinned Mathlib oleans
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake exe cache get
      - name: Kernel-check exact original-source conditions for one real collision-square hole
        working-directory: submissions/jsp-000404-wip-charlie
        run: |
          lake build JSP000404Research.ResidualLossCollisionExactLocalHoleEligibility JSP000404Research.ResidualLossCollisionSharedCornerHallObstruction JSP000404Research.ResidualLossCanonicalDebtTokenCount JSP000404Research.ActualEightSourceEarliestDebtPayment JSP000404Research.ResidualLossCanonicalRecordDebtEquiv JSP000404Research.ResidualLossTwoColourOppositeNoReuse JSP000404Research.ResidualLossGlobalNonlocalShortfallLedger JSP000404Research.PlanarLowerBranchNonlocalCollisionDefectFrontier JSP000404Research.ResidualLossCanonicalOppositePairRigidity JSP000404Research.ResidualLossCanonicalOppositeSignatureBound JSP000404Research.ResidualLossCanonicalOppositeFibreBound JSP000404Research.ResidualLossOppositeFibreExactPairCriterion JSP000404Research.ResidualLossTripleCornerTrueHoleCeiling JSP000404Research.ResidualLossTripleFibreGlobalPaymentBarrier JSP000404Research.ResidualLossTripleFibreSixCentreBarrier JSP000404Research.PlanarThreeFiveNoTripleLossFibre JSP000404Research.PlanarThreeFiveLossDuplicateBound JSP000404Research.PlanarThreeFiveExactDoubleFibreLedger JSP000404Research.ActualOneLossCentreNonlocalBudget JSP000404Research.ActualZeroLossCentreBlockerElimination JSP000404Research.ActualTwoLossCentreNoReuse JSP000404Research.ActualLossAnyWidthTwoDisagreements JSP000404Research.ActualAnyWidthFourLossCentreReuseBarrier JSP000404Research.ActualThreeLossCentreLocalHallPayment JSP000404Research.ActualAnyWidthOppositeFibrePacking JSP000404Research.ActualAnyWidthGlobalOppositeDebtPacking JSP000404Research.ActualAnyWidthHighExponentReuseGate JSP000404Research.ActualSharedOwnerOppositeNotExterior JSP000404Research.ActualExteriorOppositeFibrePacking JSP000404Research.ActualEarliestSourceExteriorCrossActivity JSP000404Research.ActualEarliestOriginalNonlocalEligibility JSP000404Research.ActualEarliestBicolourNonlocalBarrier JSP000404Research.ActualOneHighLossCentreFibrePacking JSP000404Research.ActualOneHighLossCentreGlobalDebtCapacity JSP000404Research.PlanarFourColourHighLossGlobalDebtCapacity JSP000404Research.PlanarFourColourOneHighFibrePacking JSP000404Research.PlanarFourColourHighLossReuseUniqueTop
      - name: Scope
        if: always()
        run: echo 'Exact local holes, canonical earliest-prior records, and typed duplicate-debt tokens; global payment still open.'
