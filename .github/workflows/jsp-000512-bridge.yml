name: JSP-000512 bridge

on:
  push:
    branches:
      - research/jsp-000512-planarity-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: submissions/jsp-000512-partial-rotation-systems
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib cache
        run: lake exe cache get
      - name: Build rotation permutation assembly
        run: lake build Probe.GutnerRotationPermutation
      - name: Build rotation local-cycle core
        run: lake build Probe.GutnerRotationCore
      - name: Build face setup
        run: lake build Probe.GutnerFaceSetup
      - name: Build graph connected certificate
        run: lake build Probe.GutnerConnected
      - name: Build edge-count certificate
        run: lake build Probe.GutnerEdgeCard
      - name: Build quadrilateral-orbit card certificate
        run: lake build Probe.GutnerFaceQuadCard
      - name: Build face length >= 3 certificate
        run: lake build Probe.GutnerFaceTwoNe
      - name: Build face length 3-or-4 certificate
        run: lake build Probe.GutnerFaceThreeOrFour
      - name: Build quadrilateral classification certificate
        run: lake build Probe.GutnerFaceThreeNe
      - name: Build face-count bridge assembly
        run: lake build Probe.GutnerRotation
      - name: Build exact JSP-000512 theorem
        run: lake build Probe.PlanarExactBound
      - name: Build probe library
        run: lake build
      - name: Run submission verifier
        run: python3 scripts/verify.py
