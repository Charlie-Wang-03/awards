name: JSP-000404 Focused Actual Eight-Source Hall Payment

on:
  push:
    branches:
      - research/jsp-000404-connector-compiler-repair-20261024
    paths:
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ActualEightSourceHallPaymentCriterion.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ActualEightSourceFilteredNonlocalNecessity.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ActualEarliestExactCoveredVsTranslatedDefect.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ActualEightSourceNonreuseCertificate.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ActualExternalHoleNonreuseCertificate.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/SixPointCutBothBadSmallAnglesDirect.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/SixPointMergedRepeatedColour.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/SixPointCutSharedC4SmallAngle.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/SixPointBadSharedC4FromEquality.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/TwoBadMonochromaticC4Incidence.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/SixPointBadSharedC4Colour.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/SixPointBadActiveC4.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/FiveMinimaC4UniqueCanary.lean"
      - ".github/workflows/jsp000404-focused-actual-hall-payment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsp000404-focused-actual-hall-payment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Audit executable proof holes
        working-directory: submissions/jsp-000404-wip-charlie
        run: |
          python3 scripts/jsp000404_sorry_audit.py --root JSP000404Research --allowed-wip JSP000404Research/PlanarLowerBranchProofAdmittedWIP.lean --wip-max-sorries 1
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        id: lake-packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            submissions/jsp-000404-wip-charlie/.lake/packages
            submissions/jsp-000404-wip-charlie/lake-manifest.json
          key: jsp000404-lake-v2-${{ runner.os }}-${{ hashFiles('submissions/jsp-000404-wip-charlie/lakefile.toml', 'submissions/jsp-000404-wip-charlie/lean-toolchain') }}
      - name: Resolve dependencies if uncached
        if: steps.lake-packages.outputs.cache-hit != 'true'
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake update
      - name: Restore pinned Mathlib oleans
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake exe cache get
      - name: Kernel-check eight-source true-hole Hall matching criterion
        working-directory: submissions/jsp-000404-wip-charlie
        run: |
          lake build JSP000404Research.ActualEightSourceHallPaymentCriterion JSP000404Research.ActualEightSourceFilteredNonlocalNecessity JSP000404Research.ActualEarliestExactCoveredVsTranslatedDefect
      - name: Scope
        if: always()
        run: echo 'Conditional genuine credit Hall expansion only; geometric existence unproved; global payment remains open; global six-source payment remains unproved.'
