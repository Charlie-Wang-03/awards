name: JSP-000404 Verified Research Umbrella Compilation

on:
  push:
    branches:
      - research/jsp-000404-connector-compiler-repair-20261024
    paths:
      - "submissions/jsp-000404-wip-charlie/JSP000404Research.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/PlanarExactTransitionCostPacking.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/PlanarWeightedLowSupportPacking.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/PlanarTruePaymentCardinalityHardStop.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/PlanarIntegerNextLayerSupportRigidity.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/PlanarFourSixExactIntegerCapacity.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/PlanarThreeManyIntegerNextPacking.lean"
      - ".github/workflows/jsp000404-verified-research-umbrella.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsp000404-verified-research-umbrella-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Audit executable proof holes
        working-directory: submissions/jsp-000404-wip-charlie
        run: |
          python3 scripts/jsp000404_sorry_audit.py --root JSP000404Research --allowed-wip JSP000404Research/PlanarLowerBranchProofAdmittedWIP.lean --wip-max-sorries 1
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake packages
        id: lake-packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            submissions/jsp-000404-wip-charlie/.lake/packages
            submissions/jsp-000404-wip-charlie/lake-manifest.json
          key: jsp000404-lake-v2-${{ runner.os }}-${{ hashFiles('submissions/jsp-000404-wip-charlie/lakefile.toml', 'submissions/jsp-000404-wip-charlie/lean-toolchain') }}
      - name: Resolve dependencies if uncached
        if: steps.lake-packages.outputs.cache-hit != 'true'
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake update
      - name: Restore pinned Mathlib oleans
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake exe cache get
      - name: Build integrated original research library with exact admitted global gate
        working-directory: submissions/jsp-000404-wip-charlie
        run: |
          lake build JSP000404Research
      - name: Scope
        if: always()
        run: echo 'Umbrella import closure includes original admitted root: exactly one genuine sorry persists, no complete JSP-000404 claim.'
