name: JSP-000404 Targeted Bridge

on:
  push:
    branches:
      - research/jsp-000404-sharp-centre
    paths:
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/QTTTSmallPairMatching.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/QTTTThreeSupportSmallPairMatching.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/QTTTThreeSupportFiniteTerminal.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ResidualCommonWordTriangleSecondLayerOutlet.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ResidualDeficientCoreSecondLayerOutlet.lean"
      - ".github/workflows/jsp000404-targeted-terminal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsp000404-targeted-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check targeted bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake package cache
        id: lake-package-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            submissions/jsp-000404-wip-charlie/.lake/packages
            submissions/jsp-000404-wip-charlie/lake-manifest.json
          key: jsp000404-lake-v2-${{ runner.os }}-${{ hashFiles('submissions/jsp-000404-wip-charlie/lakefile.toml', 'submissions/jsp-000404-wip-charlie/lean-toolchain') }}

      - name: Resolve Lake dependencies
        if: steps.lake-package-cache.outputs.cache-hit != 'true'
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake update

      - name: Restore mathlib cache
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake exe cache get

      - name: Check three-support finite terminal
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.QTTTThreeSupportFiniteTerminal

      - name: Check common-word triangle outlet
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ResidualCommonWordTriangleSecondLayerOutlet

      - name: Check deficient-core second-layer outlet
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ResidualDeficientCoreSecondLayerOutlet

      - name: Check planar deficient-core to QTTT bridge
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ProjectionDeficientCoreCommonWordQTTT

      - name: Probe exact-two whole-cube terminal
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ProjectionQTTTSupportOrWholeCube

      - name: Check minimal-core QTTT support-recursion terminal
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ProjectionMinimalCoreQTTTTerminal
