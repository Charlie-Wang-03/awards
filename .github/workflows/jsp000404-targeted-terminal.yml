name: JSP-000404 Targeted Bridge

on:
  push:
    branches:
      - research/jsp-000404-sharp-centre
    paths:
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/QTTTSmallPairMatching.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/QTTTThreeSupportSmallPairMatching.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/QTTTThreeSupportFiniteTerminal.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ResidualCommonWordTriangleSecondLayerOutlet.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ResidualDeficientCoreSecondLayerOutlet.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/LinearBandGapStepTight.lean"
      - "submissions/jsp-000404-wip-charlie/scripts/jsp000404_sorry_audit.py"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/SaturatedWrapDescent.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/LinearSaturatedEndpointDichotomy.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/PlanarLowerBranchHardWordInjection.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ProjectionLossZeroUnitStep.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/RefinedResidualHardRemainder.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/PlanarUpperBranchHardDefect.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ProjectionLossFlipCoordinate.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ResidualLossTranslatedBlock.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ResidualLossTranslatedConflict.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ResidualLossAllActiveSlices.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ProjectionLossAugmentingTransition.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ProjectionThreeWholeCubeUniqueSupportOneContradiction.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ProjectionThreeWholeCubeUniqueSupportOneTerminal.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ResidualLossAllActiveCandidateBlock.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ResidualLossRecursiveOutlet.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/CentreSignPath.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ThreeWholeCubeExtremeUniqueness.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ResidualLossFibreRigidity.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/NearPerfectRefinedHardMatching.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/HardProjectionWordClassification.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/MinimalBlockPrivateDeficit.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/MinimalBlockSharedDeficit.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/MinimalBlockTransferCapacityBoundary.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ResidualExactPairStateClassification.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ResidualZeroZeroRecursiveOutlet.lean"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/ProjectionResidualHardRemainder.lean"
      - ".github/workflows/jsp000404-targeted-terminal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsp000404-targeted-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check targeted bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake package cache
        id: lake-package-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            submissions/jsp-000404-wip-charlie/.lake/packages
            submissions/jsp-000404-wip-charlie/lake-manifest.json
          key: jsp000404-lake-v2-${{ runner.os }}-${{ hashFiles('submissions/jsp-000404-wip-charlie/lakefile.toml', 'submissions/jsp-000404-wip-charlie/lean-toolchain') }}

      - name: Resolve Lake dependencies
        if: steps.lake-package-cache.outputs.cache-hit != 'true'
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake update

      - name: Restore mathlib cache
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake exe cache get

      - name: Audit executable Lean proof holes (exclude comments and strings)
        working-directory: submissions/jsp-000404-wip-charlie
        run: |
          python3 scripts/jsp000404_sorry_audit.py --self-test
          python3 scripts/jsp000404_sorry_audit.py --root JSP000404Research

      - name: Check repaired kernel interfaces (collect all failures)
        working-directory: submissions/jsp-000404-wip-charlie
        run: |
          failures=0
          for module in LinearBandGapStepTight SaturatedWrapDescent LinearSaturatedEndpointDichotomy PlanarLowerBranchHardWordInjection ProjectionLossZeroUnitStep ProjectionLossFlipCoordinate RefinedResidualHardRemainder NearPerfectRefinedHardMatching HardProjectionWordClassification PlanarUpperBranchHardDefect MinimalBlockPrivateDeficit MinimalBlockSharedDeficit MinimalBlockTransferCapacityBoundary ResidualExactPairStateClassification ResidualZeroZeroRecursiveOutlet ProjectionResidualHardRemainder; do
            echo "::group::JSP000404Research.$module"
            lake build "JSP000404Research.$module" || failures=1
            echo "::endgroup::"
          done
          exit "$failures"

      - name: Check three-support finite terminal
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.QTTTThreeSupportFiniteTerminal

      - name: Check common-word triangle outlet
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ResidualCommonWordTriangleSecondLayerOutlet

      - name: Check deficient-core second-layer outlet
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ResidualDeficientCoreSecondLayerOutlet

      - name: Check planar deficient-core to QTTT bridge
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ProjectionDeficientCoreCommonWordQTTT

      - name: Probe exact-two whole-cube terminal
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ProjectionQTTTSupportOrWholeCube

      - name: Check minimal-core QTTT support-recursion terminal
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake build JSP000404Research.ProjectionMinimalCoreQTTTTerminal
