name: JSP-000404 Fast Incremental Lean

on:
  push:
    branches:
      - research/jsp-000404-sharp-centre
    paths:
      - "submissions/jsp-000404-wip-charlie/JSP000404Research/**"
      - "submissions/jsp-000404-wip-charlie/JSP000404Research.lean"
      - "submissions/jsp-000404-wip-charlie/lakefile.toml"
      - "submissions/jsp-000404-wip-charlie/lean-toolchain"
      - "submissions/jsp-000404-wip-charlie/lake-manifest.json"
      - "submissions/jsp-000404-wip-charlie/scripts/jsp000404_sorry_audit.py"
      - "submissions/jsp-000404-wip-charlie/scripts/jsp000404_incremental_ci.py"
      - ".github/workflows/jsp000404-targeted-terminal.yml"
  workflow_dispatch:
    inputs:
      modules:
        description: "Space/comma-separated Lean modules, e.g. ResidualLossFibreGlobal ZeroUnitStepQuotient"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jsp000404-targeted-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  incremental:
    name: Check changed Lean modules (not the full theorem)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Audit executable Lean proof holes
        working-directory: submissions/jsp-000404-wip-charlie
        run: |
          python3 -m py_compile scripts/jsp000404_incremental_ci.py
          python3 scripts/jsp000404_sorry_audit.py --self-test
          python3 scripts/jsp000404_sorry_audit.py --root JSP000404Research --allowed-wip JSP000404Research/PlanarLowerBranchProofAdmittedWIP.lean --wip-max-sorries 2

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lake package cache
        id: lake-packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            submissions/jsp-000404-wip-charlie/.lake/packages
            submissions/jsp-000404-wip-charlie/lake-manifest.json
          key: jsp000404-lake-v2-${{ runner.os }}-${{ hashFiles('submissions/jsp-000404-wip-charlie/lakefile.toml', 'submissions/jsp-000404-wip-charlie/lean-toolchain') }}

      - name: Resolve Lake dependencies
        if: steps.lake-packages.outputs.cache-hit != 'true'
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake update

      - name: Restore pinned mathlib oleans
        working-directory: submissions/jsp-000404-wip-charlie
        run: lake exe cache get

      - name: Restore previously compiled project oleans
        id: project-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: submissions/jsp-000404-wip-charlie/.lake/build
          key: jsp000404-proof-v1-${{ runner.os }}-${{ hashFiles('submissions/jsp-000404-wip-charlie/lakefile.toml', 'submissions/jsp-000404-wip-charlie/lean-toolchain', 'submissions/jsp-000404-wip-charlie/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jsp000404-proof-v1-${{ runner.os }}-${{ hashFiles('submissions/jsp-000404-wip-charlie/lakefile.toml', 'submissions/jsp-000404-wip-charlie/lean-toolchain', 'submissions/jsp-000404-wip-charlie/lake-manifest.json') }}-

      - name: Invalidate modified sources and select targets
        id: select
        working-directory: submissions/jsp-000404-wip-charlie
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          INPUT_MODULES: ${{ inputs.modules }}
        run: python3 scripts/jsp000404_incremental_ci.py prepare

      - name: Build changed Lean modules with imported dependencies
        if: steps.select.outputs.targets != ''
        working-directory: submissions/jsp-000404-wip-charlie
        env:
          LEAN_TARGETS: ${{ steps.select.outputs.targets }}
        run: |
          read -r -a targets <<< "$LEAN_TARGETS"
          lake build "${targets[@]}"

      - name: Record successfully checked source versions
        if: steps.select.outputs.targets != ''
        working-directory: submissions/jsp-000404-wip-charlie
        run: python3 scripts/jsp000404_incremental_ci.py snapshot

      - name: Save verified incremental project oleans
        if: steps.select.outputs.targets != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: submissions/jsp-000404-wip-charlie/.lake/build
          key: jsp000404-proof-v1-${{ runner.os }}-${{ hashFiles('submissions/jsp-000404-wip-charlie/lakefile.toml', 'submissions/jsp-000404-wip-charlie/lean-toolchain', 'submissions/jsp-000404-wip-charlie/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verification scope
        if: always()
        env:
          LEAN_TARGETS: ${{ steps.select.outputs.targets }}
        run: |
          echo "Fast workflow: changed/selected Lean modules plus imports."
          echo "Targets: $LEAN_TARGETS"
          echo "This is NOT a complete proof or final award acceptance check."
